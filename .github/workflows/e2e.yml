# End-to-end test through the Edgegap matchmaker: two headless players queue, land on one
# deployment, play a full match over wss, and the server must stop itself afterwards.
# Uses only the matchmaker's client token (client/config.js), never the Edgegap API token.
name: Matchmaker e2e

on:
  workflow_dispatch:
    inputs:
      players:
        description: Headless players
        default: "2"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Play a match through the matchmaker
        run: |
          export MM_URL=$(node -e 'import("./client/config.js").then(m=>console.log(m.default.matchmakerUrl))')
          export MM_TOKEN=$(node -e 'import("./client/config.js").then(m=>console.log(m.default.matchmakerToken))')
          if [ -z "$MM_URL" ] || [ -z "$MM_TOKEN" ]; then echo "Set matchmakerUrl and matchmakerToken in client/config.js first (README step 5)"; exit 1; fi
          node tests/e2e.mjs arena ${{ inputs.players }}
