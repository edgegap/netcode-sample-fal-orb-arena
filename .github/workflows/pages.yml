# Publishes the browser client (client/) to GitHub Pages. The page is static: only the game
# server runs on Edgegap. From the edgegap-threejs skill (assets/ci/pages.yml).
# Optional and manual: run it from the Actions tab when you want the page online.
# Turn Pages on once: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client
      - id: deploy
        uses: actions/deploy-pages@v4
